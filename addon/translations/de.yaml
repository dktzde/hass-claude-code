---
configuration:
  model:
    name: Modell
    description: >-
      Login: Claude Code fragt beim ersten Start nach der Anmeldung, hier ist
      kein Token nötig. Diese Option wählt das Claude-Modell.
  mobile_login:
    name: Mobiler Login
    description: >-
      Solange Claude Code auf den Login wartet, wird der Login-Link als
      Benachrichtigung in Home Assistant gesendet, damit man ihn auf dem Handy
      antippen kann, statt ihn zu kopieren. Wirkt nach einem Neustart.
  mobile_tabs:
    name: Mobile Tabs
    description: >-
      Zeigt unten im Terminal eine antippbare Leiste: ein Tab pro Claude-Code-
      Fenster und einen +-Knopf, der ein weiteres startet, damit sich auf dem
      Handy mehrere Sitzungen nutzen lassen. Dazu ▲/▼ zum Scrollen (mit Seitenzähler), ⤓ springt ans Ende, und ⇧⇥
      (Shift+Tab, wechselt den Modus von Claude Code) und ganz rechts Esc. Schaltet die Maus in tmux ein.
      Wirkt nach einem Neustart.
  disable_mouse:
    name: Maus-Unterstützung abschalten
    description: >-
      Claude Code fängt die Maus nicht mehr ab, damit sich Text auf dem Handy
      mit dem Finger markieren und kopieren lässt. Mausrad-Scrollen und Klicks
      in Claude Code funktionieren dann nicht mehr. Wirkt nach einem Neustart.
  additional_packages:
    name: Zusätzliche Pakete
    description: >-
      Weitere Alpine-Pakete, die bei jedem Start installiert werden (z. B. vim).
