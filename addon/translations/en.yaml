---
configuration:
  anthropic_base_url:
    name: ANTHROPIC_BASE_URL
    description: >-
      Another address for the API requests. Empty: the Anthropic API. Takes
      effect after a restart.
  anthropic_auth_token:
    name: ANTHROPIC_AUTH_TOKEN
    description: >-
      API key of the provider, sent as a bearer token. Empty: log in with a
      Claude subscription or an Anthropic Console account. Takes effect after
      a restart.
  anthropic_model:
    name: ANTHROPIC_MODEL
    description: >-
      Free model name, for example sonnet or opus. Empty: the default model.
      Takes effect after a restart.
  protect_internal_files:
    name: Protect internal files
    description: >-
      Claude Code cannot change Home Assistant's internal files: .storage,
      .cloud, deps, tts and the recorder database. Turn it off only to repair
      such a file on purpose. Takes effect after a restart.
  mobile_login:
    name: Mobile login
    description: >-
      While Claude Code waits for the login, send the login link as a
      notification in Home Assistant, so you can tap it on a phone instead of
      copying it. Takes effect after a restart.
  mobile_tabs:
    name: Mobile tabs
    description: >-
      Show a tappable bar at the bottom of the terminal: one tab per Claude
      Code window and a + button that starts another one, so you can run
      several sessions from a phone. Also ↑/↓ to scroll (with a page counter), ⇧⇥ (Shift+Tab,
      switches the Claude Code mode) and Esc on the far right. Turns on the mouse in tmux. Takes effect
      after a restart.
  mobile_scroll:
    name: Swipe to scroll
    description: >-
      On a touch screen, a vertical swipe on the terminal scrolls like a mouse
      wheel, also inside Claude Code. Taps keep working. No effect on devices
      without a touch screen. Takes effect after a restart.
  disable_mouse:
    name: Disable mouse support
    description: >-
      Claude Code stops capturing the mouse, so text can be selected and
      copied with a finger on a phone. Mouse wheel scrolling and clicks inside
      Claude Code stop working. Takes effect after a restart.
  additional_packages:
    name: Additional packages
    description: >-
      Extra Alpine packages, installed on every start (for example vim).
