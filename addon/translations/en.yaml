---
configuration:
  model:
    name: Model
    description: >-
      Login: Claude Code asks you to log in on first start, no token is needed
      here. This option selects the Claude model.
  mobile_login:
    name: Mobile login
    description: >-
      While Claude Code waits for the login, send the login link as a
      notification in Home Assistant, so you can tap it on a phone instead of
      copying it. Takes effect after a restart.
  mobile_tabs:
    name: Mobile tabs
    description: >-
      Show a tappable bar at the bottom of the terminal: one tab per Claude
      Code window and a + button that starts another one, so you can run
      several sessions from a phone. Also ↑/↓ to scroll (with a page counter), ⇧⇥ (Shift+Tab,
      switches the Claude Code mode) and Esc on the far right. Turns on the mouse in tmux. Takes effect
      after a restart.
  disable_mouse:
    name: Disable mouse support
    description: >-
      Claude Code stops capturing the mouse, so text can be selected and
      copied with a finger on a phone. Mouse wheel scrolling and clicks inside
      Claude Code stop working. Takes effect after a restart.
  additional_packages:
    name: Additional packages
    description: >-
      Extra Alpine packages, installed on every start (for example vim).
