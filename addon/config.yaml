---
name: Claude Code
version: 0.4.2
slug: claude_code
description: AI coding assistant with full Home Assistant access
# Linked as "more information" on the add-on page in Home Assistant
url: https://github.com/dktzde/hass-claude-code
startup: services
ingress: true
ingress_port: 0
ingress_stream: true
init: false
panel_icon: mdi:robot
panel_title: Claude Code
arch:
  - aarch64
  - amd64
homeassistant_api: true
hassio_api: true
hassio_role: admin
map:
  - homeassistant_config:rw
  - addon_config:rw
  - share:rw
  - ssl:ro
  - media:ro
# Optional: when the Mosquitto broker add-on is installed, the Supervisor
# hands its credentials to this add-on (see init-claude).
services:
  - mqtt:want
options:
  model: "default"
  yolo_mode: false
  additional_packages: []
schema:
  model: "list(default|sonnet|opus|haiku)"
  yolo_mode: bool
  additional_packages:
    - str
