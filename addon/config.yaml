---
name: Claude Code
version: 0.19.2
slug: claude_code
description: Claude Code in your sidebar, with an MCP server for entities, services and the Home Assistant docs
# Linked as "more information" on the add-on page in Home Assistant
url: https://github.com/dktzde/hass-claude-code
startup: services
ingress: true
ingress_port: 0
ingress_stream: true
init: false
# Seconds the Supervisor waits for the add-on to stop before it kills it
# (default 10). A normal stop takes about 5 s: s6 stops the services, then
# gives the other processes (tmux, Claude Code) a few seconds to exit. Under
# load, right after an image build, one stop took 24 s and ended with exit
# code 137 (killed).
timeout: 90
panel_icon: mdi:console-network
panel_title: Claude Code
arch:
  - aarch64
  - amd64
homeassistant_api: true
hassio_api: true
hassio_role: admin
map:
  - homeassistant_config:rw
  - addon_config:rw
  - share:rw
  - ssl:ro
  - media:ro
# Optional: when the Mosquitto broker add-on is installed, the Supervisor
# hands its credentials to this add-on (see init-claude).
services:
  - mqtt:want
options:
  anthropic_base_url: ""
  anthropic_auth_token: ""
  anthropic_model: "opus"
  protect_internal_files: true
  mobile_login: false
  mobile_tabs: false
  mobile_tab_titles: false
  mobile_tab_status: false
  mobile_scroll: true
  disable_mouse: false
  additional_packages: []
schema:
  anthropic_base_url: "str?"
  anthropic_auth_token: "password?"
  anthropic_model: "str?"
  protect_internal_files: bool
  mobile_login: bool
  mobile_tabs: bool
  mobile_tab_titles: bool
  mobile_tab_status: bool
  mobile_scroll: bool
  disable_mouse: bool
  additional_packages:
    - str
