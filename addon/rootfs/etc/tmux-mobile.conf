# Claude Code Add-on: tmux configuration for the option mobile_tabs.
# Loaded by the ttyd service (tmux -f). Without the option, tmux uses its defaults.
#
# A finger cannot press Ctrl+b, so the status bar becomes tappable:
# one tab per Claude Code window, a button that starts another one,
# a Shift+Tab button (switches the Claude Code mode) and an Esc button.
# Scrolling is left to the mouse wheel (tmux mouse mode) and, on a phone,
# to the option mobile_scroll (swipe to scroll).
# Each tab shows the model and the effort of its Claude Code session, and a
# second line shows what each tab works on (its title).

set -g mouse on
set -g base-index 1
set -g status on
set -g status-position bottom
set -g status-style 'bg=colour238,fg=colour250'
set -g status-left ''
set -g status-left-length 0
set -g status-justify left

# Keep the tab labels short: the window number, a colon and one lower case
# letter each for the model and the effort, for example " 1:om  " (Opus,
# effort medium), so you can see which effort a session runs with. Model:
# o Opus, s Sonnet, h Haiku, f Fable, ? other; effort: l low, m medium,
# h high, x xhigh, X max, ? unknown. Both come from tmux-tab-info, which
# claude-entrypoint.sh sets as Claude Code's status line while @hcc_tab_info
# is on; until the first reply, or with a status line of the user's own, the
# tab shows the number only. Either way a tab is 7 columns wide (tapped
# often); the other buttons are narrow, so the bar fits on a phone.
set -g @hcc_tab_info on
set -g window-status-separator ''
set -g @hcc_tab_name '#{?@hcc_model, #I:#{@hcc_model}#{@hcc_effort}  ,   #I   }'
set -g window-status-format '#[range=window|#{window_index}]#{E:@hcc_tab_name}#[norange]'
set -g window-status-current-format '#[range=window|#{window_index}]#[bg=colour208,fg=colour16,bold]#{E:@hcc_tab_name}#[norange]'

# Buttons on the right: Shift+Tab, new window, Esc.
set -g status-right '#[range=user|stab]#[bg=colour94,fg=colour255,bold] ⇧⇥ #[norange]#[range=user|new]#[bg=colour30,fg=colour255,bold] + #[norange]#[range=user|esc]#[bg=colour124,fg=colour255,bold] Esc #[norange]'
set -g status-right-length 40

# Second line: one entry per tab, "<model><effort>:<title>", for example
# "oh:Hass-cla…" (Opus, effort high). The title is the terminal title that
# Claude Code sets (pane_title) without the status symbol in front (✳ idle,
# a spinner while it works). Until the first reply, or with a status line of
# the user's own, the entry shows the title only. The title gets shorter the more tabs there are,
# so the line fits on a phone (about 40 columns). It is a tmux list with the
# active entry as its focus, so with many tabs tmux scrolls the line and the
# active entry stays visible. A tap opens a popup with the full title, model
# and effort.
set -g status 2
set -g @hcc_tab_title '#{s/^[^a-zA-Z0-9]+ //:pane_title}'
set -g @hcc_tab_label '#{?@hcc_model,#{@hcc_model}#{@hcc_effort}:,}#{?#{e|<:#{session_windows},2},#{=/30/…:#{E:@hcc_tab_title}},#{?#{e|<:#{session_windows},3},#{=/13/…:#{E:@hcc_tab_title}},#{?#{e|<:#{session_windows},4},#{=/7/…:#{E:@hcc_tab_title}},#{=/3/…:#{E:@hcc_tab_title}}}}}'
set -g status-format[1] '#[align=left,bg=colour236,fg=colour250]#[list=on]#{W:#[list=on range=user|i#{window_index}] #{E:@hcc_tab_label} #[norange],#[list=focus range=user|i#{window_index}]#[bg=colour208,fg=colour16,bold] #{E:@hcc_tab_label} #[norange]#[bg=colour236,fg=colour250,nobold]}#[nolist]'

# Esc leaves copy mode, otherwise it sends Escape. A tap on an entry of the
# second line opens the popup of that tab. display-popup does not expand the
# mouse formats in its command; run -C expands them while the tap is current.
bind -n MouseDown1Status \
    if -F '#{m:i*,#{mouse_status_range}}' { run -C 'display-popup -E -w 90% -h 80% "/usr/bin/tmux-tab-info --show #{s/^i//:mouse_status_range}"' } { \
    if -F '#{==:#{mouse_status_range},new}' { new-window /usr/bin/claude-entrypoint.sh } { \
    if -F '#{==:#{mouse_status_range},stab}' { send-keys BTab } { \
    if -F '#{==:#{mouse_status_range},esc}' { if -F '#{pane_in_mode}' { send -X cancel } { send-keys Escape } } { \
    select-window -t = } } } }
