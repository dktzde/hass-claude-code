# Claude Code Add-on: tmux configuration for the option mobile_tabs.
# Loaded by the ttyd service (tmux -f). Without the option, tmux uses its defaults.
#
# A finger cannot press Ctrl+b, so the status bar becomes tappable:
# one tab per Claude Code window, a button that starts another one,
# a Shift+Tab button (switches the Claude Code mode) and an Esc button.
# Scrolling is left to the mouse wheel (tmux mouse mode) and, on a phone,
# to the option mobile_scroll (swipe to scroll).
# A second line shows what each tab works on: model, effort and title.

set -g mouse on
set -g base-index 1
set -g status on
set -g status-position bottom
set -g status-style 'bg=colour238,fg=colour250'
set -g status-left ''
set -g status-left-length 0
set -g status-justify left

# Keep the tab labels short: only the window number. Tabs keep wide padding
# (tapped often); the other buttons are narrow, so the bar fits on a phone.
set -g window-status-separator ''
set -g window-status-format '#[range=window|#{window_index}]   #I   #[norange]'
set -g window-status-current-format '#[range=window|#{window_index}]#[bg=colour208,fg=colour16,bold]   #I   #[norange]'

# Buttons on the right: Shift+Tab, new window, Esc.
set -g status-right '#[range=user|stab]#[bg=colour94,fg=colour255,bold] ⇧⇥ #[norange]#[range=user|new]#[bg=colour30,fg=colour255,bold] + #[norange]#[range=user|esc]#[bg=colour124,fg=colour255,bold] Esc #[norange]'
set -g status-right-length 40

# Second line: one entry per tab, "<model><effort>:<title>", for example
# "Oh:Hass-cla…" (Opus, effort high). The title is the terminal title that
# Claude Code sets (pane_title) without the status symbol in front (✳ idle,
# a spinner while it works). Model and effort come from tmux-tab-info, which
# claude-entrypoint.sh sets as Claude Code's status line while @hcc_tab_info
# is on; until the first reply, or with a status line of the user's own, the
# entry shows the title only. The title gets shorter the more tabs there are,
# so the line fits on a phone (about 40 columns). A tap opens a popup with the
# full title, model and effort.
set -g @hcc_tab_info on
set -g status 2
set -g @hcc_tab_title '#{s/^[^a-zA-Z0-9]+ //:pane_title}'
set -g @hcc_tab_label '#{?@hcc_model,#{@hcc_model}#{@hcc_effort}:,}#{?#{e|<:#{session_windows},2},#{=/30/…:#{E:@hcc_tab_title}},#{?#{e|<:#{session_windows},3},#{=/13/…:#{E:@hcc_tab_title}},#{?#{e|<:#{session_windows},4},#{=/7/…:#{E:@hcc_tab_title}},#{=/3/…:#{E:@hcc_tab_title}}}}}'
set -g status-format[1] '#[align=left,bg=colour236,fg=colour250]#{W:#[range=user|i#{window_index}] #{E:@hcc_tab_label} #[norange],#[range=user|i#{window_index}]#[bg=colour208,fg=colour16,bold] #{E:@hcc_tab_label} #[norange]#[bg=colour236,fg=colour250,nobold]}'

# Esc leaves copy mode, otherwise it sends Escape. A tap on an entry of the
# second line opens the popup of that tab. The popup command does not see the
# mouse formats, so the window number goes through @hcc_popup_window.
bind -n MouseDown1Status \
    if -F '#{m:i*,#{mouse_status_range}}' { set -gF @hcc_popup_window '#{s/^i//:mouse_status_range}' ; display-popup -E -w 90% -h 80% /usr/bin/tmux-tab-info --show } { \
    if -F '#{==:#{mouse_status_range},new}' { new-window /usr/bin/claude-entrypoint.sh } { \
    if -F '#{==:#{mouse_status_range},stab}' { send-keys BTab } { \
    if -F '#{==:#{mouse_status_range},esc}' { if -F '#{pane_in_mode}' { send -X cancel } { send-keys Escape } } { \
    select-window -t = } } } }
