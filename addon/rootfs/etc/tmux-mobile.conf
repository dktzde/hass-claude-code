# Claude Code Add-on: tmux configuration for the option mobile_tabs.
# Loaded by the ttyd service (tmux -f). Without the option, tmux uses its defaults.
#
# A finger cannot press Ctrl+b, so the status bar becomes tappable:
# one tab per Claude Code window, a button that starts another one,
# scroll buttons and a Shift+Tab button (switches the Claude Code mode).

set -g mouse on
set -g base-index 1
set -g status on
set -g status-position bottom
set -g status-style 'bg=colour238,fg=colour250'
set -g status-left ''
set -g status-left-length 0
set -g status-justify left

# Keep the tab labels short: only the window number
set -g window-status-separator ''
set -g window-status-format '#[range=window|#{window_index}]   #I   #[norange]'
set -g window-status-current-format '#[range=window|#{window_index}]#[bg=colour208,fg=colour16,bold]   #I   #[norange]'

# Buttons on the right: scroll up, scroll down, Shift+Tab, new window
set -g status-right '#[range=user|up]#[bg=colour60,fg=colour255,bold]  ▲  #[norange]#[range=user|down]#[bg=colour61,fg=colour255,bold]  ▼  #[norange]#[range=user|stab]#[bg=colour94,fg=colour255,bold]  ⇧⇥  #[norange]#[range=user|new]#[bg=colour30,fg=colour255,bold]   +   #[norange]'
set -g status-right-length 60

# A swipe on a phone sends no mouse wheel events, so the arrows scroll instead.
# In copy mode they page through the tmux history. If the program draws on the
# alternate screen (Claude Code), they send PageUp/PageDown to it. Otherwise
# ▲ opens copy mode; scrolling down to the bottom leaves it again.
bind -n MouseDown1Status \
    if -F '#{==:#{mouse_status_range},new}' { new-window /usr/bin/claude-entrypoint.sh } { \
    if -F '#{==:#{mouse_status_range},stab}' { send-keys BTab } { \
    if -F '#{==:#{mouse_status_range},up}' { \
        if -F '#{pane_in_mode}' { send -X page-up } { \
        if -F '#{alternate_on}' { send-keys PPage } { copy-mode -e ; send -X page-up } } } { \
    if -F '#{==:#{mouse_status_range},down}' { \
        if -F '#{pane_in_mode}' { send -X page-down-and-cancel } { \
        if -F '#{alternate_on}' { send-keys NPage } } } { \
    select-window -t = } } } }
