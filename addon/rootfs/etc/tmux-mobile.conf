# Claude Code Add-on: tmux configuration for the option mobile_tabs.
# Loaded by the ttyd service (tmux -f). Without the option, tmux uses its defaults.
#
# A finger cannot press Ctrl+b, so the status bar becomes tappable:
# one tab per Claude Code window, plus a button that starts another one.

set -g mouse on
set -g base-index 1
set -g status on
set -g status-position bottom
set -g status-style 'bg=colour238,fg=colour250'
set -g status-left ''
set -g status-left-length 0
set -g status-justify left

# Keep the tab labels short: only the window number
set -g window-status-separator ''
set -g window-status-format '#[range=window|#{window_index}]   #I   #[norange]'
set -g window-status-current-format '#[range=window|#{window_index}]#[bg=colour208,fg=colour16,bold]   #I   #[norange]'

# "+" button on the right
set -g status-right '#[range=user|new]#[bg=colour30,fg=colour255,bold]   +   #[norange]'
set -g status-right-length 20

# Tap a tab: switch to it. Tap "+": start another Claude Code in a new window.
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},new}' \
    { new-window /usr/bin/claude-entrypoint.sh } \
    { select-window -t = }
