# Claude Code Add-on: status of each tab in the mobile_tabs bar, option mobile_tab_status.
# Loaded by the ttyd service after /etc/tmux-mobile.conf (another tmux -f),
# only when both options are on.
#
# The character between the window number and the model letters shows what
# the session does:
#   *  Claude Code works
#   _  done, waits for your next message
#   !  waits for your answer (a permission prompt, a question or a plan)
#      (a space) new session, nothing asked yet (also after /clear)
# for example " 1*om  ". The state comes from Claude Code hooks that
# claude-entrypoint.sh adds while @hcc_tab_status is on (tmux-tab-info
# --state). Until a hook has run, for example with disableAllHooks, the tab
# shows ":" as without this option. Before the first reply the model is not
# known yet and the tab shows the number and the character only. A tab stays
# 7 columns wide.
#
# An interrupt with Esc runs no hook. The Esc button in the bar and the Esc
# key (bound here; the key still reaches the pane or copy mode as before)
# make tmux-tab-info --check look for the interrupt in the transcript.

set -g @hcc_tab_status on
set -g @hcc_tab_name '#{?#{e|<:#{window_index},10}, ,}#{?@hcc_model,#I#{?@hcc_state_char,#{@hcc_state_char},:}#{@hcc_model}#{@hcc_effort}  ,  #I#{?@hcc_state_char,#{@hcc_state_char}, }  }'
bind -n Escape { send-keys Escape ; run -b '/usr/bin/tmux-tab-info --check #{pane_id}' }
