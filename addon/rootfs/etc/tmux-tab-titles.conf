# Claude Code Add-on: second line of the mobile_tabs bar, option mobile_tab_titles.
# Loaded by the ttyd service after /etc/tmux-mobile.conf (a second tmux -f),
# only when both options are on.
#
# One entry per tab with the title that Claude Code sets for its session
# (pane_title) without the status symbol in front (✳ idle, a spinner while it
# works), so you can see what each tab works on. The model and the effort are
# in the tab itself (/etc/tmux-mobile.conf). A session without a topic yet
# shows "new": Claude Code's title is just "Claude Code" until the first
# message, and before Claude Code sets a title tmux uses the host name. The title gets shorter the more tabs there are, so the line fits on
# a phone (about 40 columns). It is a tmux list with the active entry as its
# focus, so with many tabs tmux scrolls the line and the active entry stays
# visible. A tap opens a popup with the full title, model and effort (see the
# MouseDown1Status binding in /etc/tmux-mobile.conf).

set -g status 2
set -g @hcc_tab_title_raw '#{s/^[^a-zA-Z0-9]+ //:pane_title}'
set -g @hcc_tab_title '#{?#{||:#{||:#{==:#{E:@hcc_tab_title_raw},Claude Code},#{==:#{E:@hcc_tab_title_raw},}},#{==:#{pane_title},#{host}}},new,#{E:@hcc_tab_title_raw}}'
set -g @hcc_tab_label '#{?#{e|<:#{session_windows},2},#{=/36/…:#{E:@hcc_tab_title}},#{?#{e|<:#{session_windows},3},#{=/16/…:#{E:@hcc_tab_title}},#{?#{e|<:#{session_windows},4},#{=/10/…:#{E:@hcc_tab_title}},#{=/7/…:#{E:@hcc_tab_title}}}}}'
set -g status-format[1] '#[align=left,bg=colour236,fg=colour250]#[list=on]#{W:#[list=on range=user|i#{window_index}] #{E:@hcc_tab_label} #[norange],#[list=focus range=user|i#{window_index}]#[bg=colour208,fg=colour16,bold] #{E:@hcc_tab_label} #[norange]#[bg=colour236,fg=colour250,nobold]}#[nolist]'
