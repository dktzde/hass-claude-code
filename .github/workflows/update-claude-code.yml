name: Update add-on

# Weekly version of .claude/skills/update-claude/SKILL.md: bumps the pinned
# Claude Code version when a newer release exists, picks up Alpine package
# updates (including Python 3), updates the MCP server's npm dependencies within
# their major versions and regenerates the bundled Home Assistant docs. Each of
# these busts its own Docker layer via a pinned value in addon/Dockerfile or the
# lockfile, since the Supervisor builds with the layer cache. Any change is
# released as one add-on update. As issues it reports what stays manual: new
# commits in upstream and the YangXu1990uiuc fork, a new base image, and new
# major versions of npm dependencies.

on:
  schedule:
    # Saturday 05:47 UTC (07:47 CEST / 06:47 CET). Cron runs in UTC and there is
    # deliberately no DST handling. GitHub delays or drops scheduled runs under
    # high load and names the start of every hour as a high-load time, so the
    # minute is off the :00/:15/:30/:45 marks.
    - cron: "47 5 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-claude-code

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      IMAGE: hass-claude-code-test:local
    steps:
      - uses: actions/checkout@v7

      - name: Check Claude Code version
        id: claude
        run: |
          current=$(grep -oP '^ARG CLAUDE_CODE_VERSION=\K.*' addon/Dockerfile)
          latest=$(curl -fsSL https://registry.npmjs.org/@anthropic-ai/claude-code/latest | jq -r .version)
          echo "Pinned: $current, latest: $latest"
          # sort -V keeps a moved-back "latest" tag from downgrading the pin
          if [ "$latest" = "$current" ] || [ "$(printf '%s\n' "$current" "$latest" | sort -V | tail -1)" != "$latest" ]; then
            echo "Claude Code $current is up to date." >> "$GITHUB_STEP_SUMMARY"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! curl -fsI "https://downloads.claude.ai/claude-code-releases/$latest/manifest.json" > /dev/null; then
            echo "::error::Claude Code $latest is on npm but has no release manifest on downloads.claude.ai"
            exit 1
          fi
          sed -i "s/^ARG CLAUDE_CODE_VERSION=.*/ARG CLAUDE_CODE_VERSION=$latest/" addon/Dockerfile
          sed -i "s/(currently \*\*[0-9.]*\*\*)/(currently **$latest**)/" README.md
          echo "Claude Code: $current -> $latest" >> "$GITHUB_STEP_SUMMARY"
          { echo "update=true"; echo "version=$latest"; } >> "$GITHUB_OUTPUT"

      - name: Regenerate docs
        id: docs
        run: |
          # A docs failure must not hold back the Claude Code and package updates
          if ! { python3 -I .claude/skills/hass-dev-docs/scripts/update-docs.py docs/hass-developer &&
                 python3 -I .claude/skills/hass-dev-docs/scripts/update-user-docs.py docs/hass-user; }; then
            echo "::warning::Regenerating the docs failed; keeping the current docs."
            git checkout -- docs
            git clean -fdq -- docs
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The scripts rewrite their CHANGELOG.md on every run; only content
          # changes count as a docs update.
          if [ -z "$(git status --porcelain -- docs ':!docs/*/CHANGELOG.md')" ]; then
            git checkout -- docs
            echo "Docs are up to date." >> "$GITHUB_STEP_SUMMARY"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add docs
          files=$(git diff --cached --name-only -- docs ':!docs/*/CHANGELOG.md' | wc -l)
          # Same value as `git rev-parse HEAD:docs` once committed
          stamp=$(git write-tree --prefix=docs/)
          sed -i "s/^ARG DOCS_STAMP=.*/ARG DOCS_STAMP=$stamp/" addon/Dockerfile
          echo "Docs: $files files changed" >> "$GITHUB_STEP_SUMMARY"
          { echo "update=true"; echo "files=$files"; } >> "$GITHUB_OUTPUT"

      - name: Update npm dependencies
        id: npm
        run: |
          # Re-resolve to the newest versions the ranges in package.json allow
          # (never a new major), with the same Alpine and pnpm as the builder
          # stage. The Dockerfile installs from this lockfile with
          # --frozen-lockfile, so every device builds the tested versions.
          builder=$(grep -oP '^FROM \K\S+(?= AS mcp-builder)' addon/Dockerfile)
          pnpm_major=$(grep -oP 'npm install -g pnpm@\K[0-9]+' addon/Dockerfile)
          lock=addon/mcp-server/pnpm-lock.yaml
          rm "$lock"
          if ! docker run --rm -v "$PWD/addon/mcp-server:/w" -w /w -e HOST_ID="$(id -u):$(id -g)" "$builder" sh -c \
              "apk add --no-cache nodejs npm >/dev/null && npm install -g pnpm@$pnpm_major >/dev/null 2>&1 &&
               pnpm install --lockfile-only && chown \"\$HOST_ID\" pnpm-lock.yaml"; then
            echo "::warning::Updating the npm dependencies failed; keeping the current lockfile."
            git checkout -- "$lock"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet -- "$lock"; then
            echo "npm dependencies are up to date." >> "$GITHUB_STEP_SUMMARY"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # "name@version" keys of the packages/snapshots sections, without the
          # peer suffix "(peer@x)", so only real version changes are listed
          versions() { grep -oP "^  '?\K[^ '(]+@[0-9][^ '(:]*" | LC_ALL=C sort -u; }
          mapfile -t new < <(LC_ALL=C comm -13 <(git show "HEAD:$lock" | versions) <(versions < "$lock"))
          if [ "${#new[@]}" -eq 0 ]; then
            list="lockfile changed, no new versions"
          else
            list=$(printf '`%s`, ' "${new[@]:0:10}")
            list=${list%, }
            if [ "${#new[@]}" -gt 10 ]; then list="$list and $(( ${#new[@]} - 10 )) more"; fi
          fi
          echo "npm dependencies: $list" >> "$GITHUB_STEP_SUMMARY"
          { echo "update=true"; echo "list=$list"; } >> "$GITHUB_OUTPUT"

      - name: Test-build the add-on (amd64)
        run: docker buildx build addon --pull --platform linux/amd64 --load -t "$IMAGE"

      - name: Check the built image
        run: |
          pinned=$(grep -oP '^ARG CLAUDE_CODE_VERSION=\K.*' addon/Dockerfile)
          installed=$(docker run --rm --entrypoint /root/.local/bin/claude "$IMAGE" --version | awk '{print $1}')
          echo "Claude Code installed: $installed, pinned: $pinned"
          [ "$installed" = "$pinned" ]
          docker run --rm --entrypoint python3 "$IMAGE" -c 'import json, sqlite3, ssl, sys, yaml; print(sys.version, "PyYAML", yaml.__version__)'
          docker run --rm --entrypoint sh "$IMAGE" -c 'command -v mosquitto_pub && command -v mosquitto_sub && gh --version'
          bash .github/scripts/mcp-smoke-test.sh "$IMAGE"

      # The test build clones docs from main, which does not have the new docs
      # yet, so index them separately with the image's own indexer.
      - name: Index the regenerated docs
        if: steps.docs.outputs.update == 'true'
        run: |
          docker run --rm -v "$PWD/docs:/docs:ro" \
            -e DOCS_PATH=/docs -e DOCS_DB_PATH=/tmp/docs-check.db -e ENABLE_EMBEDDINGS=false \
            --entrypoint node "$IMAGE" /opt/mcp-server/dist/build-index.js

      - name: Compare system package versions
        id: packages
        run: |
          docker run --rm --entrypoint apk "$IMAGE" list --installed 2>/dev/null \
            | awk '{print $1}' | LC_ALL=C sort > "$RUNNER_TEMP/packages.txt"
          # Also guards against a changed `apk list` output format
          grep -q '^python3-[0-9]' "$RUNNER_TEMP/packages.txt"
          touch addon/packages.txt
          if cmp -s "$RUNNER_TEMP/packages.txt" addon/packages.txt; then
            echo "System packages are up to date." >> "$GITHUB_STEP_SUMMARY"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t new < <(LC_ALL=C comm -13 addon/packages.txt "$RUNNER_TEMP/packages.txt")
          if [ "${#new[@]}" -eq 0 ]; then
            list="packages removed only"
          else
            list=$(printf '`%s`, ' "${new[@]:0:10}")
            list=${list%, }
            if [ "${#new[@]}" -gt 10 ]; then list="$list and $(( ${#new[@]} - 10 )) more"; fi
          fi
          mv "$RUNNER_TEMP/packages.txt" addon/packages.txt
          stamp=$(sha256sum addon/packages.txt | cut -c1-12)
          sed -i "s/^ARG PACKAGES_STAMP=.*/ARG PACKAGES_STAMP=$stamp/" addon/Dockerfile
          echo "System packages: $list" >> "$GITHUB_STEP_SUMMARY"
          { echo "update=true"; echo "list=$list"; } >> "$GITHUB_OUTPUT"

      - name: Bump version, changelog, commit and push
        if: >-
          steps.claude.outputs.update == 'true' || steps.docs.outputs.update == 'true' ||
          steps.packages.outputs.update == 'true' || steps.npm.outputs.update == 'true'
        env:
          CLAUDE_UPDATE: ${{ steps.claude.outputs.update }}
          CLAUDE: ${{ steps.claude.outputs.version }}
          DOCS_UPDATE: ${{ steps.docs.outputs.update }}
          DOCS_FILES: ${{ steps.docs.outputs.files }}
          PACKAGES_UPDATE: ${{ steps.packages.outputs.update }}
          PACKAGES: ${{ steps.packages.outputs.list }}
          NPM_UPDATE: ${{ steps.npm.outputs.update }}
          NPM: ${{ steps.npm.outputs.list }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          addon_current=$(grep -oP '^version: \K.*' addon/config.yaml)
          addon="${addon_current%.*}.$(( ${addon_current##*.} + 1 ))"
          sed -i "s/^version: .*/version: $addon/" addon/config.yaml
          declare -a parts=()
          # addon/CHANGELOG.md is what HA shows in the update dialog
          {
            printf '## %s\n\n' "$addon"
            printf -- '- **Automated update** by the GitHub Action "Update add-on" ([workflow run](%s))\n' "$RUN_URL"
            if [ "$CLAUDE_UPDATE" = true ]; then printf -- '- Update Claude Code to %s\n' "$CLAUDE"; fi
            if [ "$PACKAGES_UPDATE" = true ]; then printf -- '- Update system packages: %s\n' "$PACKAGES"; fi
            if [ "$NPM_UPDATE" = true ]; then printf -- '- Update npm dependencies of the MCP server: %s\n' "$NPM"; fi
            if [ "$DOCS_UPDATE" = true ]; then printf -- '- Update the bundled Home Assistant docs (%s files changed)\n' "$DOCS_FILES"; fi
            printf '\n'
            cat addon/CHANGELOG.md
          } > CHANGELOG.new
          mv CHANGELOG.new addon/CHANGELOG.md
          if [ "$CLAUDE_UPDATE" = true ]; then parts+=("Claude Code to $CLAUDE"); fi
          if [ "$PACKAGES_UPDATE" = true ]; then parts+=("system packages"); fi
          if [ "$NPM_UPDATE" = true ]; then parts+=("npm dependencies"); fi
          if [ "$DOCS_UPDATE" = true ]; then parts+=("docs"); fi
          message=$(IFS=,; echo "${parts[*]}" | sed 's/,/, /g')
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon/Dockerfile addon/config.yaml addon/CHANGELOG.md addon/packages.txt addon/mcp-server/pnpm-lock.yaml README.md docs
          git commit -m "chore(addon): update $message (automated)"
          git push origin HEAD:main
          echo "Released add-on version $addon: $message." >> "$GITHUB_STEP_SUMMARY"

  report:
    # Reports what stays a manual decision as issues: one open issue per topic,
    # refreshed while it applies and closed once it no longer does.
    runs-on: ubuntu-latest
    env:
      # Explicit so gh never picks a fetched fork as the target repo
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Report new upstream and fork commits
        run: |
          source .github/scripts/sync-issue.sh
          git fetch -q https://github.com/dkmaker/hass-claude-code.git main:refs/remotes/upstream/main
          git fetch -q https://github.com/YangXu1990uiuc/hass-claude-code.git main:refs/remotes/yangxu/main
          reviewed=$(grep -oP 'Last reviewed commit: `\K[0-9a-f]+' .claude/skills/update-claude/SKILL.md)

          commits_body() {
            if [ -n "$1" ]; then
              printf 'Neue Commits seit dem letzten Stand:\n\n%s\n\nPrüfen und bei Bedarf lokal mit `/update-claude` übernehmen.' "$1"
            fi
          }

          upstream=$(git log --format='- `%h` %ad %s' --date=short HEAD..upstream/main)
          yangxu=$(git log --format='- `%h` %ad %s' --date=short "$reviewed"..yangxu/main)
          {
            echo "### dkmaker/hass-claude-code (upstream)"
            echo "${upstream:-Keine neuen Commits.}"
            echo "### YangXu1990uiuc/hass-claude-code (seit $reviewed)"
            echo "${yangxu:-Keine neuen Commits.}"
          } >> "$GITHUB_STEP_SUMMARY"
          sync_issue "Neue Commits in dkmaker/hass-claude-code (upstream)" "$(commits_body "$upstream")" "Keine offenen Commits mehr."
          sync_issue "Neue Commits im Fork YangXu1990uiuc/hass-claude-code" "$(commits_body "$yangxu")" "Keine offenen Commits mehr."

      - name: Report base image updates and support end
        if: ${{ !cancelled() }}
        run: |
          source .github/scripts/sync-issue.sh
          title="Basis-Image: neue Version oder Support-Ende"
          # Assigned first so a failing script stops the step instead of closing the issue
          body=$(bash .github/scripts/base-image-report.sh)
          # Carry on an open issue with the earlier title instead of opening a new one
          old=$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "Neues Basis-Image hassio-addons/base verfügbar") | .number' | head -1)
          if [ -n "$old" ]; then gh issue edit "$old" --title "$title"; fi
          sync_issue "$title" "$body" "Das Basis-Image ist aktuell und sein Support läuft noch."

      - name: Report new major versions of npm dependencies
        if: ${{ !cancelled() }}
        run: |
          source .github/scripts/sync-issue.sh
          body=$(bash .github/scripts/npm-report.sh)
          sync_issue "Neue Hauptversionen von npm-Paketen" "$body" "Keine neuen Hauptversionen mehr."

  failure-issue:
    # One open issue while runs fail: opened on the first failure, commented on
    # each further failure (so it notifies again), closed by the next good run.
    needs: [update, report]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open, update or close the failure issue
        env:
          UPDATE: ${{ needs.update.result }}
          REPORT: ${{ needs.report.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Update add-on fehlgeschlagen"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ "$UPDATE" != failure ] && [ "$REPORT" != failure ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Der Lauf vom $(date -u +%d.%m.%Y) war wieder erfolgreich: $RUN_URL"
            fi
            exit 0
          fi
          failed=""
          if [ "$UPDATE" = failure ]; then
            failed="- **update** (Claude Code, Pakete, Doku, Testbuild): Es wurde nichts veröffentlicht, HA bietet kein Update an."
          fi
          if [ "$REPORT" = failure ]; then
            failed="${failed:+$failed
          }- **report** (Issues zu Forks, Basis-Image, npm): Mindestens ein Issue wurde nicht aktualisiert."
          fi
          body=$(printf 'Der Lauf vom %s ist fehlgeschlagen: [Log ansehen](%s)\n\nFehlgeschlagen:\n%s\n\nDas Add-on auf deinem Gerät ist davon nicht betroffen. Dieses Issue schließt sich beim nächsten erfolgreichen Lauf von selbst.' \
            "$(date -u +%d.%m.%Y)" "$RUN_URL" "$failed")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
